<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; padding: 40px; background: #0b1120; font-family: sans-serif; display: flex; gap: 20px; flex-wrap: wrap; }
    .card {
      width: 500px;
      height: 580px;
      background: white;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header { padding: 20px; font-weight: bold; }
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .img-wrapper {
      position: relative;
      max-height: 100%;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
    }
    img {
      max-height: 400px;
      max-width: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      min-width: min(100%, 250px);
      min-height: min(100%, 250px);
    }
  </style>
</head>
<body>
  <div class=card>
    <div class=header>Python for Data Science & AI</div>
    <div class=stage>
      <div class=img-wrapper>
        <img src=src/assets/images/certificates/skillsoft-python-ds.svg />
      </div>
    </div>
  </div>
  <div class=card>
    <div class=header>Advanced Python Programming</div>
    <div class=stage>
      <div class=img-wrapper>
        <img src=src/assets/images/certificates/skillsoft-python-adv.svg />
      </div>
    </div>
  </div>
  <div class=card>
    <div class=header>SQL for Data Engineering</div>
    <div class=stage>
      <div class=img-wrapper>
        <img src=src/assets/images/certificates/skillsoft-sql-data.svg />
      </div>
    </div>
  </div>
</body>
</html>
